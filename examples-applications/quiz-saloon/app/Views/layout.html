<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — Salon de Quiz Abystream</title>
<style>
:root{--accent:#7048e8;--accent2:#9775fa;--bg:#f8f7ff;--card:#fff;--ink:#1a1a2e;--muted:#868e96;--ok:#37b24d;--ko:#f03e3e;}
*{box-sizing:border-box;}
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:1.5rem;color:var(--ink);background:var(--bg);}
header{border-bottom:3px solid var(--accent);padding-bottom:1rem;margin-bottom:1.5rem;}
header h1{color:var(--accent);margin:0;}header h1 a{color:var(--accent);text-decoration:none;}
nav a{color:var(--accent);text-decoration:none;margin-right:1rem;font-weight:600;}
.card{background:var(--card);border-radius:12px;padding:1.4rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06);}
input,button{font-size:1rem;padding:.6rem .8rem;border-radius:8px;border:1px solid #ced4da;}
button{background:var(--accent);color:#fff;border:none;cursor:pointer;}button:hover{background:var(--accent2);}
label{display:block;margin:.6rem 0 .2rem;font-weight:600;}
.choice{display:block;width:100%;text-align:left;margin:.4rem 0;background:#f1f3f5;color:var(--ink);border:1px solid #dee2e6;}
.choice:hover{background:#e5dbff;}
.msg{padding:.6rem .8rem;border-radius:8px;margin:.4rem 0;font-size:.9rem;}
.msg.ok{background:#ebfbee;color:var(--ok);}.msg.ko{background:#fff5f5;color:var(--ko);}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:.75rem;padding:.15rem .5rem;border-radius:4px;}
.scores{list-style:none;padding:0;}.scores li{padding:.4rem 0;border-bottom:1px solid #eee;}
footer{margin-top:2rem;text-align:center;color:var(--muted);font-size:.85rem;}
pre{background:#f1f3f5;padding:.6rem;border-radius:6px;overflow-x:auto;font-size:.85rem;}
</style>
</head>
<body>
<header>
<h1><a href="/">🎯 Salon de Quiz Abystream</a></h1>
<nav><a href="/room">Salon</a><a href="/modules">Modules</a></nav>
</header>
{{ content }}
<footer>Quiz sur le framework Abystream · JWT · Plugins</footer>
</body>
</html>
