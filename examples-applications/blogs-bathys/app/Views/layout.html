<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Les Passionnés de Recurstream</title>

  <style>
    :root{
      --bg: #f4f4f8;
      --card: #ffffff;
      --text: #141428;
      --muted: #6b6b7a;
      --primary: #6c5ce7;
      --primary-2: #4f46e5;
      --border: rgba(20, 20, 40, .10);
      --shadow: 0 10px 30px rgba(20,20,40,.07);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.75rem 1rem;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(108,92,231,.18), transparent 60%),
        radial-gradient(700px 350px at 95% 10%, rgba(79,70,229,.14), transparent 55%),
        var(--bg);
      line-height: 1.55;
    }

    a{ color: inherit; }

    /* Header */
    header{
      padding: 1.2rem 1.2rem 1.0rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(20,20,40,.05);
      margin-bottom: 1.4rem;
    }

    .brand{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(108,92,231,.25);
      padding-bottom: 0.9rem;
      margin-bottom: 0.9rem;
    }

    header h1{
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: .2px;
    }

    header h1 a{
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
    }

    nav{
      display: flex;
      gap: .8rem;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .95rem;
    }

    nav a{
      text-decoration: none;
      color: var(--primary);
      font-weight: 650;
      padding: .35rem .55rem;
      border-radius: 10px;
      transition: background .15s ease, transform .15s ease;
    }

    nav a:hover{
      background: rgba(108,92,231,.10);
      transform: translateY(-1px);
    }

    /* Page content area (optionnel mais utile) */
    main{
      display: block;
    }

    /* Cards */
    .post, form{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }

    .post h2{
      margin: 0 0 .35rem;
      font-size: 1.2rem;
      line-height: 1.3;
    }

    .post h2 a{
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
    }

    .post h2 a:hover{
      color: var(--primary-2);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .meta{
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: .7rem;
    }

    /* Buttons */
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      background: linear-gradient(180deg, var(--primary), var(--primary-2));
      color: #fff;
      padding: .65rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 750;
      box-shadow: 0 12px 24px rgba(108,92,231,.22);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(108,92,231,.26);
      filter: saturate(1.05);
    }

    .btn:focus-visible{
      outline: 3px solid rgba(108,92,231,.35);
      outline-offset: 2px;
    }

    /* Forms */
    form{
      margin-top: 1rem;
    }

    label{
      display: block;
      margin: .85rem 0 .35rem;
      font-weight: 750;
      color: var(--text);
      font-size: .95rem;
    }

    input, textarea{
      width: 100%;
      padding: .7rem .8rem;
      border: 1px solid rgba(20,20,40,.14);
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    textarea{
      min-height: 160px;
      resize: vertical;
    }

    input:focus, textarea:focus{
      border-color: rgba(108,92,231,.7);
      box-shadow: 0 0 0 4px rgba(108,92,231,.16);
      outline: none;
    }

    /* Footer */
    footer{
      margin-top: 1.6rem;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    /* Typo pour contenu injecté (content) */
    .content p{ margin: 0 0 1rem; }
    .content h2, .content h3{ margin-top: 1.2rem; }
    .content ul{ margin: 0 0 1rem 1.2rem; }
    .content code{
      background: rgba(108,92,231,.10);
      border: 1px solid rgba(108,92,231,.20);
      padding: .12rem .35rem;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: .95em;
    }

    /* Petites optimisations responsive */
    @media (max-width: 520px){
      body{ padding: 1.25rem 0.85rem; }
      header{ padding: 1rem; }
      .post, form{ padding: 1.05rem 1.05rem; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <h1><a href="/">Les Passionnés de Recurstream</a></h1>
      <nav>
        <a href="/">Accueil</a>
        <span aria-hidden="true">·</span>
        <a href="/posts/new">Écrire un article</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>Propulsé par Recurstream — le framework web de Recurstream</footer>
</body>
</html>
