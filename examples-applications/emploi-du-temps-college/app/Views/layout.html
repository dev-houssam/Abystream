<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titre }} — Emploi du temps</title>
<style>
:root{--accent:#1c7ed6;--bg:#f8f9fa;--carte:#fff;--ink:#212529;--muted:#868e96;--bord:#dee2e6;}
*{box-sizing:border-box;}
body{font-family:system-ui,-apple-system,sans-serif;max-width:1080px;margin:0 auto;padding:1.5rem;color:var(--ink);background:var(--bg);}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--accent);padding-bottom:.8rem;margin-bottom:1.2rem;flex-wrap:wrap;gap:.5rem;}
header h1{color:var(--accent);margin:0;font-size:1.35rem;}
header h1 a{color:var(--accent);text-decoration:none;}
nav a{color:var(--accent);text-decoration:none;margin-left:1rem;font-weight:600;}
.badge{background:var(--accent);color:#fff;font-size:.75rem;padding:.2rem .6rem;border-radius:999px;}
.carte{background:var(--carte);border-radius:10px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.06);}
table.grille{width:100%;border-collapse:collapse;font-size:.82rem;}
table.grille th,table.grille td{border:1px solid var(--bord);padding:.4rem;vertical-align:top;}
table.grille th{background:#f1f3f5;font-weight:600;}
th.heure{width:70px;color:var(--muted);font-weight:500;white-space:nowrap;}
td.occupee{background:#fff;}
td.occupee .seance{padding:.15rem .3rem;margin-bottom:.25rem;background:#fff;}
td.occupee .seance:last-child{margin-bottom:0;}
td.occupee strong{display:block;}
td.occupee small{color:var(--muted);display:block;margin-top:.15rem;}
td.occupee .classe{display:inline-block;background:#e7f5ff;color:var(--accent);font-size:.7rem;padding:.05rem .35rem;border-radius:3px;margin-left:.3rem;}
td.libre{background:#fbfbfc;}
label{display:block;margin:.5rem 0 .2rem;font-weight:600;font-size:.9rem;}
input,select{width:100%;padding:.45rem .6rem;border:1px solid var(--bord);border-radius:6px;font-size:.92rem;}
button{background:var(--accent);color:#fff;border:none;padding:.55rem 1.2rem;border-radius:6px;font-size:.95rem;cursor:pointer;}
button:hover{background:#1971c2;}
.ligne{display:flex;gap:.7rem;flex-wrap:wrap;}
.ligne>div{flex:1;min-width:130px;}
.message{background:#e7f5ff;border-left:4px solid var(--accent);padding:.6rem .9rem;border-radius:6px;margin-bottom:1rem;}
.erreur{background:#fff5f5;border-left:4px solid #f03e3e;color:#c92a2a;padding:.6rem .9rem;border-radius:6px;margin-bottom:1rem;}
ul.cours{list-style:none;padding:0;margin:0;}
ul.cours li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.45rem 0;border-bottom:1px solid #f1f3f5;font-size:.88rem;}
ul.cours button{background:#f03e3e;padding:.25rem .7rem;font-size:.8rem;}
footer{margin-top:2rem;text-align:center;color:var(--muted);font-size:.82rem;}
</style>
</head>
<body>
<header>
<h1><a href="/edt">Emploi du temps — College</a></h1>
<nav>
{{#if connecte}}<span class="badge">{{ role }}</span>{{/if}}
{{#if est_scolarite}}<a href="/scolarite">Modifier</a>{{/if}}
{{#if connecte}}<a href="/edt">Ma grille</a><a href="/logout">Deconnexion</a>{{/if}}
</nav>
</header>
<h2 style="margin:.2rem 0 1rem;font-size:1.1rem">{{ titre }}</h2>
{{ contenu }}
<footer>{{ date }} · Propulse par Abystream</footer>
</body>
</html>
